<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Trading Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Stock Trading Platform</h1>
        
        <div id="market">
            <h2>Stock Market</h2>
            <div class="stock" id="apple">
                <p><strong>AAPL</strong></p>
                <p>Price: $150</p>
                <p>Volume: 1000</p>
                <button onclick="buyStock('AAPL')">Buy Stock</button>
            </div>
            <div class="stock" id="google">
                <p><strong>GOOG</strong></p>
                <p>Price: $2800</p>
                <p>Volume: 500</p>
                <button onclick="buyStock('GOOG')">Buy Stock</button>
            </div>
            <div class="stock" id="amazon">
                <p><strong>AMZN</strong></p>
                <p>Price: $3400</p>
                <p>Volume: 300</p>
                <button onclick="buyStock('AMZN')">Buy Stock</button>
            </div>
        </div>

        <div id="portfolio">
            <h2>Your Portfolio</h2>
            <p id="portfolioDisplay">No stocks bought yet.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
